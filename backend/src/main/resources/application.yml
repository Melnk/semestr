spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:54329/semestr}
    username: ${DATABASE_USER:semestr}
    password: ${DATABASE_PASSWORD:local-development-only}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties.mail.smtp:
      auth: ${SMTP_AUTH:false}
      starttls.enable: ${SMTP_TLS:false}
      connectiontimeout: 5000
      timeout: 5000
  jackson:
    deserialization.fail-on-unknown-properties: true
  servlet.multipart.max-request-size: 5MB
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  error.include-message: never
  max-http-request-header-size: 16KB
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.show-details: never
logging.structured.format.console: ecs
semestr:
  origin: ${APP_ORIGIN:http://localhost:5173}
  secure-cookie: ${SECURE_COOKIE:false}
  mail-from: ${MAIL_FROM:hello@semestr.local}
