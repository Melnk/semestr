[package]
name = "semestr"
version = "0.1.0"
description = "Семестр — менеджер учёбы"
edition = "2021"
license = "MIT"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
url = "2"
open = "5"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
